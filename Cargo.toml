[package]
name = "GamePlayServerNode"
version = "0.1.0"
edition = "2021"

[dependencies]
actix = "0.13"
actix-web = "4"
actix-web-actors = "4"
chrono = "0.4.38"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.23.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
urlencoding = "2.1"
futures-util = "0.3.30"
reqwest = { version = "0.12.4", features = ["json"] }
lazy_static = "1.4"
regex = "1.5"
rand = "0.8"
sysinfo = "0.30.12"